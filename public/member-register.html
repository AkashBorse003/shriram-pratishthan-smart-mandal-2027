<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>सदस्य नोंदणी</title><style>body{font-family:Arial;background:#071018;color:#fff;padding:30px}.box{max-width:700px;margin:auto;background:#10242a;padding:30px;border-radius:24px}input,select{width:100%;padding:13px;margin:7px 0 15px;border-radius:10px;border:1px solid #466;background:#081318;color:white}button{padding:14px 22px;background:#e7b74a;border:0;border-radius:10px;font-weight:bold}</style></head><body><div class="box"><a href="/">← Home</a><h1>सदस्य नोंदणी</h1><form id=f><input name=name placeholder="पूर्ण नाव *" required><input name=mobile placeholder="मोबाईल क्रमांक *" required><input name=email placeholder="Email"><select name=role><option>सदस्य</option><option>कार्यकर्ता</option><option>पदाधिकारी</option><option>स्वयंसेवक</option></select><input name=area placeholder="परिसर / भाग"><input name=address placeholder="पत्ता"><button>नोंदणी करा</button></form><div id=o></div></div><script>f.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(f));let r=await fetch('/api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();o.innerHTML=r.ok?`<h2>नोंदणी यशस्वी 🙏</h2><p>Unique Member ID: <b>${d.id}</b></p><a href="/member-card.html?id=${d.id}">Digital ID Card</a>`:`<p>${d.error}</p>`}</script></body></html>
