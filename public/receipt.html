<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>वर्गणी पावती</title><style>body{font-family:Arial;background:#071018;color:#fff;padding:30px}.box{max-width:700px;margin:auto;background:#10242a;padding:30px;border-radius:24px}input,textarea,select{width:100%;padding:13px;margin:7px 0 15px;border-radius:10px;border:1px solid #466;background:#081318;color:white}button{padding:14px 22px;background:#e7b74a;border:0;border-radius:10px;font-weight:bold}</style></head><body><div class=box><a href="/">← Home</a><h1>🧾 वर्गणी पावती</h1><form id=f><input name=name placeholder="देणगीदाराचे नाव *" required><input name=mobile placeholder="मोबाईल"><input name=address placeholder="पत्ता"><input name=amount type=number min=1 placeholder="रक्कम ₹ *" required><select name=payment><option>UPI</option><option>रोख</option><option>ऑनलाइन</option></select><textarea name=note placeholder="नोंद"></textarea><button>पावती तयार करा</button></form><div id=o></div></div><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/receipts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();o.innerHTML=r.ok?`<h2>पावती तयार झाली</h2><b>${d.id}</b>`:`${d.error}`}</script></body></html>
