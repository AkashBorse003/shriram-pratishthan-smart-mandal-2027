<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin</title><style>body{font-family:Arial;background:#071018;color:#fff;padding:25px}.box{max-width:1000px;margin:auto}.card{background:#10242a;border-radius:20px;padding:20px;margin:15px 0}input{padding:12px;border-radius:10px;border:1px solid #466;background:#081318;color:#fff;margin:5px}button{padding:12px;background:#e7b74a;border:0;border-radius:10px;font-weight:bold}</style></head><body><div class=box><a href="/">← Home</a><h1>⚙️ Smart Mandal Admin</h1><div class=card><input id=pin type=password placeholder="Admin PIN"><button onclick=load()>Login</button></div><div id=app></div></div><script>let PIN='';async function load(){PIN=pin.value;let [m,r,n,a]=await Promise.all([fetch('/api/members').then(x=>x.json()),fetch('/api/receipts').then(x=>x.json()),fetch('/api/notifications').then(x=>x.json()),fetch('/api/aarti/today').then(x=>x.json())]);app.innerHTML=`<div class=card><h2>Dashboard</h2><p>👥 Members: <b>${m.length}</b></p><p>🧾 Receipts: <b>${r.length}</b></p><p>💰 Collection: <b>₹${r.reduce((s,x)=>s+Number(x.amount||0),0)}</b></p><p>🪔 आजची आरती: <b>${a?a.member_name:'नियुक्त नाही'}</b></p></div><div class=card><h2>🔔 Notification</h2><input id=t placeholder="Title"><input id=msg placeholder="Message"><button onclick=send()>Send</button></div>`}async function send(){let r=await fetch('/api/admin/notifications',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':PIN},body:JSON.stringify({title:t.value,message:msg.value})});alert(r.ok?'Notification saved':'Error')}</script></body></html>
