<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Digital ID</title><style>body{font-family:Arial;background:#071018;padding:30px}.card{max-width:700px;margin:auto;padding:30px;border-radius:28px;background:linear-gradient(135deg,#fff4d5,#dba63c);color:#10242a}.name{font-size:38px;font-weight:bold;margin:25px 0}.id{font-size:28px;font-weight:bold;letter-spacing:2px}</style></head><body><div id=x>Loading...</div><script>let id=new URLSearchParams(location.search).get('id');fetch('/api/members/'+encodeURIComponent(id)).then(r=>r.json()).then(m=>x.innerHTML=`<div class=card><b>॥ श्रीराम प्रतिष्ठान चिंचवड ॥</b><div>गणेशोत्सव २०२७</div><div class=name>${m.name}</div><p>${m.role}</p><p>📱 ${m.mobile}</p><p>📍 ${m.area||m.address||''}</p><div class=id>${m.id}</div></div>`)</script></body></html>
