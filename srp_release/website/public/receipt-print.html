<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>वर्गणी पावती</title><style>body{font-family:'Noto Sans Devanagari',Arial;background:#eee;margin:0}.wrap{max-width:1100px;margin:15px auto}.actions{text-align:center;margin:15px}.ticket{display:grid;grid-template-columns:1fr 230px;min-height:350px;border:2px solid #0d3a45;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#fffaf0,#f6ead3);margin-bottom:10px}.main{padding:25px}.stub{background:#082b34;color:#fff;padding:22px;border-left:2px dashed #d9a536;text-align:center}.brand{font-size:30px;font-weight:900;color:#8f1e16}.title{display:inline-block;background:#a93419;color:white;padding:8px 30px;border-radius:30px;font-size:26px;font-weight:900;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px}.line{border-bottom:1px dotted #52636a;padding:8px}.full{grid-column:1/-1}.qr{width:150px;height:150px;background:white;padding:7px;margin:12px auto}.qr img{width:100%;height:100%}.cut{text-align:center;border-top:2px dashed #333;padding:6px;font-weight:900}@media print{.actions{display:none}.ticket{break-inside:avoid}.cut{margin:0}}@media(max-width:700px){.ticket{grid-template-columns:1fr}.stub{border-left:0;border-top:2px dashed #d9a536}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="actions"><button onclick="print()">🖨️ Print / PDF</button></div><div id="sheet">लोड...</div></div><script>const id=new URLSearchParams(location.search).get('id');async function go(){const r=await fetch('/api/receipts');const rows=await r.json();const d=rows.find(x=>x.id===id);const settings=await (await fetch('/api/settings')).json();if(!d){sheet.innerHTML='<p>पावती सापडली नाही.</p>';return}const qr=settings.upi?'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent('upi://pay?pa='+settings.upi+'&pn=ShriRam%20Pratishthan%20Chinchwad&am='+d.amount):'';const copy=label=>`<div class="ticket"><div class="main"><div class="brand">॥ श्रीराम प्रतिष्ठान चिंचवड ॥</div><div>गणेशोत्सव २०२७</div><div class="title">वर्गणी पावती</div><div class="grid"><div class="line full"><b>मा. श्री./सौ. :</b> ${d.name}</div><div class="line full"><b>पत्ता :</b> ${d.address||''}</div><div class="line"><b>मोबाईल :</b> ${d.mobile||''}</div><div class="line"><b>दिनांक :</b> ${new Date(d.created_at).toLocaleDateString('mr-IN')}</div><div class="line"><b>वर्गणी रक्कम :</b> ₹${Number(d.amount).toLocaleString('en-IN')}</div><div class="line"><b>पेमेंट :</b> ${d.payment}</div><div class="line full"><b>अक्षरी :</b> ${d.amount_words||''}</div><div class="line full"><b>विशेष नोंद :</b> ${d.note||''}</div></div><p>आपल्या सहकार्याबद्दल मनःपूर्वक धन्यवाद! 🙏</p></div><div class="stub"><b>${label}</b>${qr?`<img class="qr" src="${qr}">`:'<div class="qr">QR</div>'}<small>Receipt ID</small><strong>${d.id}</strong></div></div>`;sheet.innerHTML=copy('देणगीदाराची प्रत')+'<div class="cut">✂ इथून कापा ✂</div>'+copy('मंडळाची हिशोब प्रत')}go();</script></body></html>
