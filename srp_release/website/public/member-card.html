<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Member ID Card</title><style>body{margin:0;background:#09171c;font-family:'Noto Sans Devanagari',Arial,sans-serif}.wrap{max-width:900px;margin:35px auto;padding:15px}.card{display:grid;grid-template-columns:180px 1fr 150px;min-height:300px;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,#fff6df,#f2c55a);box-shadow:0 20px 50px #0008}.photo{display:flex;align-items:center;justify-content:center;background:#8f1e16;color:#ffd26a;font-size:70px}.info{padding:30px}.brand{font-weight:900;color:#8f1e16;font-size:26px}.name{font-size:34px;font-weight:900;margin:20px 0 8px}.role{display:inline-block;background:#10242a;color:#fff;padding:7px 14px;border-radius:99px}.id{font-size:24px;font-weight:900;letter-spacing:2px}.qr{background:#fff;margin:20px;padding:10px;text-align:center}.qr img{width:120px;height:120px}.actions{text-align:center;margin:20px}.actions button,.actions a{padding:12px 18px;border-radius:12px;border:0;text-decoration:none}.actions button{background:#ffd26a}@media print{body{background:#fff}.actions{display:none}.wrap{margin:0}.card{box-shadow:none}}@media(max-width:700px){.card{grid-template-columns:1fr}.photo{min-height:150px}.qr{margin:0 30px 30px}}</style></head><body><div class="wrap"><div class="actions"><a href="/">← वेबसाइट</a> <button onclick="window.print()">🖨️ Print / PDF</button></div><div id="card"></div></div><script>const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){document.getElementById('card').innerHTML='<p style="color:white">URL मध्ये member ID द्या.</p>';return}const r=await fetch('/api/members/'+encodeURIComponent(id));const m=await r.json();if(!r.ok){document.getElementById('card').innerHTML='<p style="color:white">सदस्य सापडला नाही.</p>';return}const verify=location.origin+'/member-card.html?id='+encodeURIComponent(m.id);const qr='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(verify);document.getElementById('card').innerHTML=`<div class="card"><div class="photo">${m.photo?`<img src="${m.photo}" style="width:100%;height:100%;object-fit:cover">`:'ॐ'}</div><div class="info"><div class="brand">श्रीराम प्रतिष्ठान चिंचवड</div><div>गणेशोत्सव २०२७</div><div class="name">${m.name}</div><div class="role">${m.role}</div><p>📱 ${m.mobile||'—'}<br>📍 ${m.area||m.address||'—'}</p><p class="id">${m.id}</p><small>हे डिजिटल ओळखपत्र मंडळाच्या नोंदीशी जोडलेले आहे.</small></div><div><div class="qr"><img src="${qr}"><small>Scan to Verify</small></div></div></div>`}load();</script></body></html>
