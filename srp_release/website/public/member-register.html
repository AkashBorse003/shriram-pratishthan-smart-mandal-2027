<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सदस्य नोंदणी | श्रीराम प्रतिष्ठान</title><link rel="stylesheet" href="/style.css"><style>body{background:#f7efe2}.box{max-width:850px;margin:40px auto;padding:30px;background:#fff;border-radius:24px;box-shadow:0 15px 45px #0001}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form label{display:flex;flex-direction:column;gap:6px;font-weight:700}.form input,.form textarea,.form select{padding:13px;border:1px solid #d8c7ad;border-radius:12px;font:inherit}.wide{grid-column:1/-1}.success{display:none;margin-top:20px;padding:20px;border-radius:16px;background:#e8f6ea}.id{font-size:26px;font-weight:900;color:#8f1e16}@media(max-width:700px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="box"><a href="/">← मुख्य वेबसाइट</a><p class="eyebrow">॥ सदस्य नोंदणी ॥</p><h1>मंडळाचे सदस्य / कार्यकर्ता बना</h1><p>नोंदणी पूर्ण झाल्यावर Unique Member ID तयार होईल. त्याच ID वर डिजिटल कार्ड तयार करता येईल.</p><form id="form" class="form"><label>पूर्ण नाव*<input name="name" required></label><label>मोबाईल क्रमांक*<input name="mobile" required></label><label>Email<input name="email" type="email"></label><label>भूमिका<select name="role"><option>सदस्य</option><option>कार्यकर्ता</option><option>पदाधिकारी</option><option>स्वयंसेवक</option></select></label><label>परिसर / भाग<input name="area"></label><label>पत्ता<input name="address"></label><label class="wide">फोटो URL (ऐच्छिक)<input name="photo" placeholder="https://..."></label><button class="btn primary wide">नोंदणी पूर्ण करा</button></form><div class="success" id="success"></div></div><script>form.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error);success.style.display='block';success.innerHTML=`<h2>नोंदणी यशस्वी! 🙏</h2><p>तुमचा Unique Member ID:</p><div class="id">${d.id}</div><p><a href="/member-card.html?id=${encodeURIComponent(d.id)}">आता Digital ID Card पहा →</a></p>`;form.reset()}catch(x){alert(x.message)}};</script></body></html>
