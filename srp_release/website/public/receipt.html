<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart वर्गणी पावती</title><link rel="stylesheet" href="/style.css"><style>body{background:#f7efe2}.box{max-width:900px;margin:35px auto;padding:30px;background:#fff;border-radius:24px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form label{display:flex;flex-direction:column;gap:5px}.form input,.form textarea,.form select{padding:12px;border:1px solid #d8c7ad;border-radius:10px}.wide{grid-column:1/-1}@media(max-width:700px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="box"><a href="/">← मुख्य वेबसाइट</a><h1>🧾 Smart वर्गणी पावती</h1><p>नोंद सेव्ह झाल्यावर देणगीदाराची प्रत + मंडळाची हिशोब प्रत प्रिंट करता येईल.</p><form id="f" class="form"><label>देणगीदाराचे नाव*<input name="name" required></label><label>मोबाईल<input name="mobile"></label><label>पत्ता<input name="address"></label><label>रक्कम (₹)*<input name="amount" type="number" min="1" required></label><label>पेमेंट प्रकार<select name="payment"><option>UPI</option><option>रोख</option><option>ऑनलाइन</option><option>इतर</option></select></label><label>अक्षरी रक्कम<input name="amount_words"></label><label class="wide">विशेष नोंद<textarea name="note"></textarea></label><button class="btn primary wide">पावती तयार करा</button></form></div><script>f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/receipts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error);location.href='/receipt-print.html?id='+encodeURIComponent(d.id)}catch(x){alert(x.message)}};</script></body></html>
