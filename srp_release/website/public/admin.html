<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="/style.css"><style>body{background:#08151a;color:#fff}.admin{max-width:1250px;margin:auto;padding:25px}.login,.card{background:#10242a;border:1px solid #34515a;border-radius:18px;padding:22px;margin-bottom:18px}.login input,.form input,.form textarea{padding:12px;border-radius:10px;border:1px solid #526a72;background:#071318;color:#fff}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#17323b;padding:18px;border-radius:16px}.stat b{display:block;font-size:25px;color:#ffd26a}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #34515a;text-align:left}.table-wrap{overflow:auto}@media(max-width:800px){.grid,.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="admin"><a href="/" style="color:#ffd26a">← वेबसाइट</a><h1>⚙️ Smart Mandal Admin</h1><div class="login"><input id="pin" type="password" placeholder="Admin PIN"><button class="btn primary" id="login">Login</button></div><div id="app" class="hidden"><div id="stats" class="grid"></div><div class="card"><h2>मंडळ सेटिंग</h2><div class="form"><label>UPI ID<input id="upi"></label><label>मोबाईल<input id="contact"></label><label class="wide">पत्ता<input id="address"></label><label class="wide">VAPID Public Key<input id="vapidPublicKey"></label></div><button class="btn primary" id="saveSettings">जतन करा</button></div><div class="card"><h2>👥 सदस्य</h2><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>नाव</th><th>मोबाईल</th><th>भूमिका</th><th>भाग</th></tr></thead><tbody id="members"></tbody></table></div></div><div class="card"><h2>🪔 आरती नियुक्ती</h2><form id="aartiForm" class="form"><label>दिनांक<input id="aDate" type="date" required></label><label>वेळ<input id="aTime" type="time" required></label><label class="wide">सदस्य<select id="aMember"></select></label><label class="wide">नोंद<input id="aNotes"></label><button class="btn primary wide">आरती नियुक्त करा</button></form><div class="table-wrap"><table class="table"><thead><tr><th>दिनांक</th><th>वेळ</th><th>सदस्य</th><th></th></tr></thead><tbody id="aartis"></tbody></table></div></div><div class="card"><h2>🔔 सर्वांना सूचना</h2><form id="noteForm" class="form"><label>शीर्षक<input id="nTitle" required></label><label>संदेश<input id="nMessage" required></label><button class="btn primary wide">Notification पाठवा</button></form></div><div class="card"><h2>🧾 वर्गणी हिशोब</h2><button class="btn primary" id="csv">CSV Export</button><div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>नाव</th><th>रक्कम</th><th>पेमेंट</th><th>दिनांक</th></tr></thead><tbody id="receipts"></tbody></table></div></div></div></div><script>let PIN='';const H=()=>({'x-admin-pin':PIN});async function api2(u,o={}){o.headers={...(o.headers||{}),...H(),'Content-Type':'application/json'};const r=await fetch('/api'+u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.statusText);return d}login.onclick=async()=>{PIN=pin.value;try{await api2('/stats');document.querySelector('.login').style.display='none';app.classList.remove('hidden');load()}catch(e){alert('चुकीचा PIN')}};async function load(){const [st,ms,as,rs,set]=await Promise.all([api2('/stats'),api2('/members'),api2('/aarti'),api2('/receipts'),api2('/settings')]);stats.innerHTML=`<div class="stat"><b>${st.members}</b>सदस्य</div><div class="stat"><b>${st.volunteers}</b>कार्यकर्ते</div><div class="stat"><b>₹${Number(st.total).toLocaleString('en-IN')}</b>वर्गणी</div><div class="stat"><b>${st.receipts}</b>पावत्या</div>`;upi.value=set.upi||'';contact.value=set.contact||'';address.value=set.address||'';vapidPublicKey.value=set.vapidPublicKey||'';members.innerHTML=ms.map(m=>`<tr><td><a style="color:#ffd26a" href="/member-card.html?id=${encodeURIComponent(m.id)}">${m.id}</a></td><td>${m.name}</td><td>${m.mobile}</td><td>${m.role}</td><td>${m.area||''}</td></tr>`).join('');aMember.innerHTML=ms.map(m=>`<option value="${m.id}">${m.name} — ${m.role}</option>`).join('');aartis.innerHTML=as.map(a=>`<tr><td>${a.date}</td><td>${a.time}</td><td>${a.member_name}</td><td><button onclick="delA(${a.id})">हटवा</button></td></tr>`).join('');receipts.innerHTML=rs.map(r=>`<tr><td><a style="color:#ffd26a" href="/receipt-print.html?id=${encodeURIComponent(r.id)}">${r.id}</a></td><td>${r.name}</td><td>₹${Number(r.amount).toLocaleString('en-IN')}</td><td>${r.payment}</td><td>${new Date(r.created_at).toLocaleDateString('mr-IN')}</td></tr>`).join('')}saveSettings.onclick=async()=>{await api2('/settings',{method:'PUT',body:JSON.stringify({upi:upi.value,contact:contact.value,address:address.value,vapidPublicKey:vapidPublicKey.value})});alert('सेटिंग जतन झाली');load()};aartiForm.onsubmit=async e=>{e.preventDefault();const m=[...aMember.options].find(x=>x.value===aMember.value);await api2('/aarti',{method:'POST',body:JSON.stringify({date:aDate.value,time:aTime.value,member_id:aMember.value,member_name:m?.text.split(' — ')[0]||'',notes:aNotes.value})});alert('आरती नियुक्त झाली');load()};window.delA=async id=>{if(confirm('आरती नोंद हटवायची?')){await api2('/aarti/'+id,{method:'DELETE'});load()}};noteForm.onsubmit=async e=>{e.preventDefault();const r=await api2('/notifications',{method:'POST',body:JSON.stringify({title:nTitle.value,message:nMessage.value})});alert(r.pushResult==='push-attempted'?'Notification सर्व registered devices कडे पाठवण्याचा प्रयत्न झाला.':'Notification सेव्ह झाली; Web Push साठी VAPID सेट करा.');noteForm.reset()};csv.onclick=()=>{fetch('/api/export.csv',{headers:H()}).then(r=>r.blob()).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='srp-receipts-2027.csv';a.click()})};</script></body></html>
